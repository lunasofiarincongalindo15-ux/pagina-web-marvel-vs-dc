<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Marvel vs DC</title>

    <!-- CSS -->
    <link rel="stylesheet" href="pagina2.css">

    <!-- Fuente -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- =========================================
         CONTENEDOR PRINCIPAL
    ========================================== -->

    <main class="pagina">


        <!-- =========================================
             BANNER SUPERIOR
        ========================================== -->

        <header class="encabezado-pagina">

            <div class="banner">

                <div class="texto-dc">
                    DC
                </div>

                <div class="texto-marvel">
                    MARVEL
                </div>

            </div>

        </header>


        <!-- =========================================
             MENÚ DE NAVEGACIÓN
        ========================================== -->

        <nav class="menu">

            <a href="#multiverso" class="menu-item">
                MULTIVERSO
            </a>

            <a href="#heroes" class="menu-item heroes">
                HEROES
            </a>

            <a href="#comics" class="menu-item">
                COMICS
            </a>

            <a href="#votacion" class="menu-item votacion">
                votación
            </a>

        </nav>


        <!-- =========================================
             CONTENIDO PRINCIPAL
        ========================================== -->

        <section class="contenido">


            <!-- =====================================
                 MULTIVERSO
            ====================================== -->

            <article class="categoria" id="multiverso">

                <h2 class="titulo-categoria">
                    MULTIVERSO
                </h2>

                <div class="imagen-contenedor">

                    <img
                        src="img/imagen1.jpg"
                        alt="Marvel Multiverso"
                    >

                </div>

            </article>


            <!-- =====================================
                 HEROES
            ====================================== -->

            <article class="categoria" id="heroes">

                <h2 class="titulo-categoria heroes">
                    HEROES
                </h2>

                <div class="imagen-contenedor">

                    <img
                        src="img/imagen2.jpg"
                        alt="Héroes"
                    >

                </div>

            </article>


            <!-- =====================================
                 COMICS
            ====================================== -->

            <article class="categoria" id="comics">

                <h2 class="titulo-categoria">
                    COMICS
                </h2>

                <div class="imagen-contenedor">

                    <img
                        src="img/imagen3.jpg"
                        alt="Comics Marvel y DC"
                    >

                </div>

            </article>


            <!-- =====================================
                 VOTACIÓN
            ====================================== -->

            <article class="categoria" id="votacion">

                <h2 class="titulo-categoria votacion">
                    votación
                </h2>

                <div class="imagen-contenedor">

                    <img
                        src="img/imagen4.jpg"
                        alt="Votación Marvel vs DC"
                    >

                </div>

            </article>


        </section>


    </main>

</body>

</html>
